name: db_dsl
description: "A Diesel-style query language for Dart: typed tables, filters, joins, aggregates and transactions sent as a documented protocol to any engine (native LMDB, in memory, or your own)."
version: 0.2.7
repository: https://github.com/JhonaCodes/db_dsl
issue_tracker: https://github.com/JhonaCodes/db_dsl/issues

topics:
  - database
  - query-builder
  - orm
  - lmdb
  - offline-first

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  logger_rs: ^2.1.1
  meta: ^1.16.0
  result_controller: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
