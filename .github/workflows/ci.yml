name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, analyze and test db_dsl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Both packages: the root analysis also covers db_dsl_lints/.
      - name: Get dependencies
        run: |
          dart pub get
          dart pub get --directory db_dsl_lints

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test on the VM
        run: dart test

      - name: Test on the web
        run: dart test -p chrome

      - name: Run the example
        run: dart run example/example.dart

      - name: PROTOCOL.md examples are up to date
        run: |
          dart run tool/protocol_examples.dart
          git diff --exit-code PROTOCOL.md

  lints:
    name: Test the analyzer plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get
        working-directory: db_dsl_lints

      # Includes the end-to-end test: `dart analyze` with the plugin enabled
      # on a package using the real db_dsl and its example.
      - name: Test
        run: dart test
        working-directory: db_dsl_lints

  score:
    name: Package scores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install pana
        run: dart pub global activate pana

      - name: Score db_dsl
        run: dart pub global run pana --exit-code-threshold 0 .

      - name: Score db_dsl_lints
        run: dart pub global run pana --exit-code-threshold 0 db_dsl_lints
